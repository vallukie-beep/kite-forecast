name: Update forecast

on:
  schedule:
    - cron: '40 4 * * *'   # daily 04:40 UTC (05:40 winter / 06:40 summer, NL time); keep in sync with UPDATE_UTC in fetch_data.py
  workflow_dispatch:        # the "Update now" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests numpy
      - name: Get the currently published data (fallback if a source fails)
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/forecast.json" -o previous.json || echo "no previous data"
      - name: Fetch HARMONIE, SWAN and DCSM
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}   # set under Settings > Secrets and variables > Actions
        run: |
          mkdir -p site && cp -r docs/. site/
          python fetch_data.py --out site/data --previous previous.json \
            --previous-site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          du -sh site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
